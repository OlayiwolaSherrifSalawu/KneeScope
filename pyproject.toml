[project]
name = "kneescope"
version = "0.1.0"
description = "Knee MRI research review prototype (API, ML pipeline, shared contracts). Not for diagnosis."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "numpy>=1.26",
  "pillow>=10.4",
]

[project.optional-dependencies]
# Heavy dependencies for data loading, training and evaluation. Not needed for fixture mode.
ml = [
  "torch>=2.3",
  "torchvision>=0.18",
  "pydicom>=2.4",
  # Decoders for the RSNA transfer syntaxes (JPEG Lossless, JPEG 2000); KS-DATA-06
  "pylibjpeg>=2.0",
  "pylibjpeg-libjpeg>=2.1",
  "pylibjpeg-openjpeg>=2.3",
  "scikit-learn>=1.5",
  "pandas>=2.2", # dataset CSVs (train.csv, train_series.csv) in audits and label building
]
# For `pip install -e ".[dev]"` users (the Makefile uses uv); same tools as [dependency-groups].dev.
dev = ["pytest>=8.2", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11", "jsonschema>=4.23", "pre-commit>=3.7"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "jsonschema>=4.23",
  "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["contracts/kneescope_contracts", "ml/kneescope_ml", "api/kneescope_api"]

[tool.hatch.build]
dev-mode-dirs = ["contracts", "ml", "api"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["web", "artifacts", "data", ".claude"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Long prose strings (issue templates, definitions of done).
"scripts/backlog.py" = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["kneescope_contracts", "kneescope_ml", "kneescope_api"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["contracts", "ml", "api"]
packages = ["kneescope_contracts", "kneescope_ml", "kneescope_api"]
plugins = ["pydantic.mypy"]
warn_unused_ignores = false

[[tool.mypy.overrides]]
module = ["torch.*", "torchvision.*", "pydicom.*", "sklearn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --import-mode=importlib"

# CPU-only PyTorch wheels for local work and serving (no GPU assumed, decisions D-010).
# Training on a hosted GPU uses that platform's own torch build.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
