# Training configuration (KS-MODEL-02). Copied verbatim into every run directory.
[run]
seed = 2026
steps = 200
batch_size = 4
lr = 3e-4
weight_decay = 1e-4
checkpoint_every = 50

[model]
backbone = "resnet18"     # torchvision name
pretrained = false        # true downloads ImageNet weights (record the licence in the model card)
freeze_encoder = true     # baseline: frozen encoder + trained pooling and heads
embed_dim = 512           # resnet18 feature width

[data]
# "synthetic_smoke": fixture phantoms with random labels — exercises the pipeline only;
# its metrics mean nothing. "cache": tensors from scripts/cache_tensors.py (KS-DATA-09).
source = "synthetic_smoke"
finding_profile = "interaction_prototype"

[smoke]
# Smaller tensors for CPU smoke runs. Only used when data.source = "synthetic_smoke".
num_slices = 8
size = 64
n_studies = 8
unknown_label_rate = 0.25
