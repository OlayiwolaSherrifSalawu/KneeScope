name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - name: Lint and format
        run: uv run ruff check . && uv run ruff format --check .
      - name: Types
        run: uv run mypy
      - name: Tests
        run: uv run pytest
      - name: Contract artifacts in sync
        run: uv run python scripts/export_contracts.py --check
      - name: Restricted assets, design tokens, backlog graph, docs
        run: |
          python3 scripts/check_restricted_assets.py
          python3 scripts/check_layout.py
          python3 scripts/check_design_tokens.py
          python3 scripts/backlog.py check
          python3 scripts/check_docs.py

  ml:
    # CPU torch only (see pyproject [tool.uv.sources]); runs the training smoke tests.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra ml
      - name: Training/ML tests and the cached-prediction round-trip (needs torch)
        run: uv run pytest tests/ml tests/api/test_cache_roundtrip.py

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json  # pnpm version comes from web/package.json packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen:api:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm build
