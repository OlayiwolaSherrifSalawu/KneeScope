repos:
  # Ruff runs from the locked project environment so hooks and CI agree on versions.
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=1000]
        exclude: '\\.pdf$|uv\\.lock$|pnpm-lock\\.yaml$'
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
  - repo: local
    hooks:
      - id: canonical-layout
        name: canonical layout (D-012)
        entry: python3 scripts/check_layout.py
        language: system
        pass_filenames: false
